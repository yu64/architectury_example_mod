neoforge_version = 21.0.42-beta
quilt_loader_version = 0.27.0-beta.1
quilted_fabric_api_version = 11.0.0-alpha.3+0.100.7-1.21
quilt_qsl_version = 10.0.0-alpha.3+1.21.1

